services:
  replica1:
    build:
      context: ./replica1
    ports:
      - "4001:4001"
    environment:
      - NODE_ID=replica1
      - NODE_ADDR=http://replica1:4001
      - PEERS=http://replica2:4002,http://replica3:4003
      - PORT=4001
    networks:
      - raft-network
    volumes:
      - ./replica1:/app
      - /app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  replica2:
    build:
      context: ./replica2
    ports:
      - "4002:4002"
    environment:
      - NODE_ID=replica2
      - NODE_ADDR=http://replica2:4002
      - PEERS=http://replica1:4001,http://replica3:4003
      - PORT=4002
    networks:
      - raft-network
    volumes:
      - ./replica2:/app
      - /app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  replica3:
    build:
      context: ./replica3
    ports:
      - "4003:4003"
    environment:
      - NODE_ID=replica3
      - NODE_ADDR=http://replica3:4003
      - PEERS=http://replica1:4001,http://replica2:4002
      - PORT=4003
    networks:
      - raft-network
    volumes:
      - ./replica3:/app
      - /app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  gateway:
    build:
      context: ./gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REPLICAS=http://replica1:4001,http://replica2:4002,http://replica3:4003
    networks:
      - raft-network
    volumes:
      - ./gateway:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - replica1
      - replica2
      - replica3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  raft-network:
    driver: bridge
